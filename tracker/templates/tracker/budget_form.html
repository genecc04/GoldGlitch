{% extends "base.html" %}
{% block content %}
<div class="container">
  <h1>{% if form.instance.pk %}Edit{% else %}Add{% endif %} Budget</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Save</button>
  </form>
  <p style="margin-top:12px;"><a href="{% url 'budget_list' %}">Cancel</a></p>
</div>
{% endblock %}
