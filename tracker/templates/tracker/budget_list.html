<h1>Budgets</h1>
<a href="{% url 'transaction_list' %}">Transactions</a><br>
<a href="{% url 'budget_add' %}">Add Budget</a>

<table>
  <tr>
    <th>Category</th>
    <th>Month</th>
    <th>Budget</th>
    <th>Spent</th>
    <th>Remaining</th>
  </tr>
  {% for b in budgets %}
  <tr {% if b.spent > b.amount %}style="color: red;"{% endif %}>
    <td>{{ b.category }}</td>
    <td>{{ b.month|date:"F Y" }}</td>
    <td>{{ b.amount }}</td>
    <td>{{ b.spent }}</td>
    <td>{{ b.remaining }}</td>
  </tr>
  {% endfor %}
</table>
