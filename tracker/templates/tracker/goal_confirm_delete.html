{% extends "base.html" %}
{% block content %}
<div class="container">
  <h1>Delete Goal</h1>
  <p>Delete goal "{{ object.name }}"?</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit">Yes, delete</button>
  </form>
  <p style="margin-top:12px;"><a href="{% url 'goal_list' %}">Cancel</a></p>
</div>
{% endblock %}
