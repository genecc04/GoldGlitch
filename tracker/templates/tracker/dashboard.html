{% extends "base.html" %}
{% block content %}
<h1>Dashboard</h1>

<div class="summary">
  <div class="card"><div>Income</div><div class="value">{{ income }}</div></div>
  <div class="card"><div>Expenses</div><div class="value">{{ expenses }}</div></div>
  <div class="card"><div>Balance</div><div class="value">{{ balance }}</div></div>
</div>

<div class="card">
  <canvas id="categoryChart" width="400" height="400"></canvas>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
  const labels = {{ category_labels|safe }};
  const totals = {{ category_totals|safe }};

  new Chart(document.getElementById('categoryChart'), {
    type: 'pie',
    data: {
      labels: labels,
      datasets: [{
        data: totals,
        backgroundColor: ['#00b3c0', '#e15759', '#f28e2b', '#59a14f', '#af7aa1', '#edc949', '#76b7b2', '#4e79a7']
      }]
    },
    options: {
      plugins: { legend: { labels: { color: '#e4e9ef' } } }
    }
  });
</script>
{% endblock %}
