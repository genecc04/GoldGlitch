{% extends "base.html" %}
{% block content %}
<div class="container">
  <h1>Delete Category</h1>
  <p>Delete category "{{ object.name }}"? Any budgets for this category will also be deleted, and any transactions using it will become uncategorized.</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit">Yes, delete</button>
  </form>
  <p style="margin-top:12px;"><a href="{% url 'category_list' %}">Cancel</a></p>
</div>
{% endblock %}
