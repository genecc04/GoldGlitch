{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GoldGlitch</title>
<link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
<dialog id="modal-dialog">
  <button type="button" id="modal-close" aria-label="Close">&times;</button>
  <div id="modal-body"></div>
</dialog>
<script src="{% static 'js/transaction_form.js' %}"></script>
<script src="{% static 'js/modal.js' %}"></script>
<nav>
  <span class="brand">GoldGlitch</span>
  {% if user.is_authenticated %}
    <a href="{% url 'dashboard' %}">Dashboard</a>
    <a href="{% url 'category_list' %}">Categories</a>
    <a href="{% url 'transaction_list' %}">Transactions</a>
    <a href="{% url 'budget_list' %}">Budgets</a>
    <a href="{% url 'goal_list' %}">Goals</a>
    <form method="post" action="{% url 'logout' %}" class="inline-action">
      {% csrf_token %}
      <button type="submit">Log out ({{ user.username }})</button>
    </form>
  {% else %}
    <a href="{% url 'login' %}">Log in</a>
    <a href="{% url 'register' %}">Register</a>
  {% endif %}
</nav>
{% block content %}{% endblock %}
</body>
</html>
